# DNSHE 域名自动续期（Node.js 版 · GitHub Actions + Playwright/CDP 绕过 Cloudflare 盾）

name: "DNSHE Domain Auto Renew"

on:
  schedule:
    # cron 表达式：分 时 日 月 周（UTC）
    # 每天 00:00 UTC = 北京时间每天 08:00
    # API 引擎每日调用：未进入续期窗口时接口返回 renewal_not_yet_available（良性），
    # 进入窗口后自动续期成功，无需网页确认按钮状态
    - cron: '0 0 * * *'
  workflow_dispatch: # 保留手动触发按钮，便于测试

concurrency:
  group: dnshe-auto-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run DNSHE auto renew
        env:
          # ---- 引擎选择：api（推荐）/ browser（备用）----
          # 默认 api：配置了 DNSHE_API_KEY / DNSHE_API_SECRET 时自动走 API
          DNSHE_MODE: ${{ secrets.DNSHE_MODE }}
          # ---- API 引擎凭据（推荐方案，稳定无浏览器依赖）----
          DNSHE_API_KEY: ${{ secrets.DNSHE_API_KEY }}
          DNSHE_API_SECRET: ${{ secrets.DNSHE_API_SECRET }}
          # ---- 推送通知 ----
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_TITLE: ${{ secrets.PUSH_TITLE }}
          PUSH_HEADERS: ${{ secrets.PUSH_HEADERS }}
          PUSH_TEMPLATE: ${{ secrets.PUSH_TEMPLATE }}
          # ---- 可选：Telegram 直推 ----
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # ---- 可选：续期阈值（默认 180 天）----
          DNSHE_RENEW_THRESHOLD_DAYS: ${{ secrets.DNSHE_RENEW_THRESHOLD_DAYS }}
        run: node renew.js

      - name: Upload screenshots
        if: always() # 无论成功失败都上传截图，便于人工核对
        uses: actions/upload-artifact@v4
        with:
          name: dnshe-renew-screenshots
          path: screenshots/
          if-no-files-found: ignore